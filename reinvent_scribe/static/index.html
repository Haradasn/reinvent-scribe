<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>re:Invent Scribe</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg-gradient"></div>

<header class="topbar glass">
  <div class="brand">
    <span class="logo-dot"></span>
    <h1>re:Invent <em>Scribe</em></h1>
  </div>
  <div class="status-chips">
    <span id="chip-model" class="chip">model: –</span>
    <span id="chip-llm" class="chip">LLM: –</span>
    <span id="chip-mic" class="chip">mic: –</span>
  </div>
</header>

<section id="hero" class="hero" aria-live="polite"></section>

<main class="layout">
  <!-- Left: recorder + captions -->
  <section class="panel glass main-panel">
    <div class="recorder">
      <button id="btn-record" class="record-btn" data-state="idle" title="録音開始">
        <span class="icon-circle"></span>
        <span class="icon-pause"><i></i><i></i></span>
        <span class="icon-play"></span>
      </button>
      <button id="btn-stop" class="stop-btn hidden" title="停止">
        <span class="icon-stop"></span>
      </button>
      <div class="recorder-info">
        <div id="rec-title" class="rec-title">待機中</div>
        <div id="rec-timer" class="rec-timer">00:00:00</div>
      </div>
      <canvas id="waveform" width="320" height="56"></canvas>
    </div>

    <div id="captions" class="captions">
      <div class="captions-empty">録音を開始すると、ここに英語字幕が流れます</div>
    </div>
    <div class="panel-foot">
      <button id="btn-clear" class="ghost-btn hidden">画面をクリア(データは保存済み)</button>
    </div>
  </section>

  <!-- Right: summary -->
  <section class="panel glass summary-panel">
    <div class="panel-head">
      <h2>日本語要約</h2>
      <span id="summary-badge" class="badge offline">オフライン(字幕のみ)</span>
    </div>
    <div id="summaries" class="summaries">
      <div class="captions-empty">オンライン時、定期的に要約が更新されます</div>
    </div>
  </section>

  <!-- Bottom: chat + recordings -->
  <section class="panel glass chat-dock">
    <div class="panel-head">
      <h2>チャット <span id="chat-target" class="chat-target"></span></h2>
    </div>
    <div id="chat-log" class="chat-log"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" placeholder="文字起こしについて質問する…" autocomplete="off">
      <button type="submit" class="send-btn">送信</button>
    </form>
  </section>

  <section class="panel glass">
    <div class="panel-head">
      <input id="list-date" class="date-input" type="date" aria-label="表示する日付">
      <button id="btn-report" class="ghost-btn">日報生成</button>
    </div>
    <div id="day-chips" class="day-chips"></div>
    <ul id="session-list" class="session-list"></ul>
  </section>
</main>

<!-- Start modal -->
<dialog id="start-modal" class="modal glass">
  <h2>予定外の録音</h2>
  <form id="start-form" method="dialog">
    <label>セッションID <input id="f-id" required placeholder="KEY001"></label>
    <label>タイトル <input id="f-title" required placeholder="Opening Keynote"></label>
    <label>メモ <textarea id="f-memo" rows="2" placeholder="任意"></textarea></label>
    <div class="modal-actions">
      <button type="button" id="btn-cancel" class="ghost-btn">キャンセル</button>
      <button type="submit" class="primary-btn">録音開始</button>
    </div>
  </form>
</dialog>

<!-- Report modal -->
<dialog id="report-modal" class="modal glass wide">
  <h2>出張日報</h2>
  <label>上司のメンション <input id="f-mention" placeholder="@山田太郎" autocomplete="off"></label>
  <div class="tabs" role="tablist">
    <button id="tab-slack" class="ghost-btn" role="tab">Slack投稿文</button>
    <button id="tab-md" class="ghost-btn" role="tab">日報(Markdown)</button>
  </div>
  <pre id="report-body" class="report-body"></pre>
  <div class="modal-actions">
    <button id="btn-regen" class="ghost-btn">生成する</button>
    <button id="btn-copy" class="primary-btn">コピー</button>
    <button id="btn-report-close" class="ghost-btn">閉じる</button>
  </div>
</dialog>

<!-- Memo modal -->
<dialog id="memo-modal" class="modal glass">
  <h2>メモ編集</h2>
  <textarea id="memo-edit" rows="4"></textarea>
  <div class="modal-actions">
    <button id="btn-memo-save" class="primary-btn">保存</button>
    <button id="btn-memo-close" class="ghost-btn">閉じる</button>
  </div>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
