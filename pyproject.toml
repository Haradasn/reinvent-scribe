[project]
name = "reinvent-scribe"
version = "0.1.0"
description = "Local recording + realtime English transcription + Japanese summaries for re:Invent sessions"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sounddevice",
    "faster-whisper",
    "httpx",
    "numpy",
    "pillow",
    "pillow-heif",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["reinvent_scribe"]
